<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Times New Roman',serif;font-size:11pt;color:#000;}
/* 2 colunas. O cabecalho/rodape (barras, titulo, logos) vem do header/footer do PDF,
   full-bleed nas bordas. Sem linha central por CSS (a arte ja traz os tracos). */
.conteudo{column-count:2;column-gap:24px;padding:0 14mm;}
.tema-titulo{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1.5px solid #000;padding-bottom:2px;margin:10px 0 8px;break-after:avoid;}
.questao{margin-bottom:12px;break-inside:avoid;}
.questao p{line-height:1.35;margin-bottom:5px;text-align:justify;font-size:10.5pt;}
.questao-num{font-weight:700;}
.opcoes{padding-left:12px;}
.opcao{margin-bottom:2px;line-height:1.3;font-size:10pt;}
/* Linha central FLUTUANTE: fixa, com folga no topo e embaixo (nao encosta no cabecalho
   nem nos logos). Fixa = altura toda em toda pagina, nao para no texto. */
.divisoria{position:fixed;top:8mm;bottom:8mm;left:50%;width:1px;background:#999;transform:translateX(-50%);}
</style></head><body>
<div class="divisoria"></div>
<div class="conteudo">{{CONTEUDO}}</div>
</body></html>
